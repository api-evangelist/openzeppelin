- name: OpenZeppelin Contracts API Reference
  description: >
    The OpenZeppelin Contracts library provides a comprehensive collection of modular, reusable, and secure
    Solidity smart contracts for building decentralized applications. The API reference covers ERC token
    standards (ERC-20, ERC-721, ERC-1155), access control, governance, security utilities (reentrancy
    guards, pausable), upgradeable proxy patterns, and cryptographic primitives. Used by thousands of
    blockchain projects as the industry standard for secure smart contract development.
  image: https://www.openzeppelin.com/hubfs/openzeppelin-logo.png
  humanURL: https://docs.openzeppelin.com/contracts
  baseURL: https://docs.openzeppelin.com/contracts
