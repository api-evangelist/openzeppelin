apis:
- name: OpenZeppelin Monitor API
  description: >
    OpenZeppelin Monitor is an open-source blockchain monitoring service that watches for specific on-chain
    activities and triggers notifications based on configurable conditions. It supports real-time monitoring
    of EVM-compatible networks, Solana, and Stellar with flexible match conditions on functions, events,
    and transactions. Notification channels include Slack, Discord, Email, Telegram, Webhooks, and custom
    scripts. Configurable via JSON files with cron-based scheduling and optional metrics server on port
    8081.
  image: https://www.openzeppelin.com/hubfs/openzeppelin-logo.png
  humanURL: https://docs.openzeppelin.com/monitor
  baseURL: http://localhost:8081
  tags:
  - Monitors
  - Blockchain
  - Alerts
  - Event
  - Smart Contracts
  - Notification
  - Open-Source
  - Onchain
  tags_raw:
